<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SANGAM</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #e8eef6;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 14px;
        background: linear-gradient(135deg, #0b1f3a, #0f766e); color: #fff;
        display: grid; place-items: center; font: 700 28px Georgia, serif;
      }
      code { background: #fff; padding: 2px 6px; border-radius: 4px; }
      a { color: #1d4ed8; font-weight: 600; }
      .box {
        max-width: 32rem; background: #fff; border: 1px solid #cbd5e1;
        border-radius: 12px; padding: 1.25rem; margin-top: 1rem; text-align: left;
        font-size: 0.95rem; line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">S</div>
      <h1>SANGAM</h1>
      <p>This repository root file is not the React app.</p>
      <div class="box">
        <p><strong>Development</strong></p>
        <p>1. Run <code>setup.bat</code> (Windows) or <code>./setup.sh</code> (Unix)</p>
        <p>2. Run <code>start.bat</code> or <code>./start.sh</code></p>
        <p>3. Open <a href="http://localhost:5180">http://localhost:5180</a></p>
        <p style="margin-top:1rem"><strong>Local production</strong></p>
        <p>Run <code>deploy-local.bat</code>, then open
          <a href="http://localhost:8100">http://localhost:8100</a></p>
      </div>
    </div>
  </body>
</html>
