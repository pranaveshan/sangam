<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1f3a" />
    <title>SANGAM — Societal Innovation Platform | SIH26043</title>
    <meta
      name="description"
      content="Crowdsource societal challenges and collaborate with universities and industry. Smart India Hackathon 2026 — SIH26043."
    />
    <meta property="og:title" content="SANGAM — SIH26043" />
    <meta
      property="og:description"
      content="Societal innovation platform connecting citizens, universities, students and industry."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./og-image.svg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #e8eef6;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      #root { min-height: 100vh; }
      .sangam-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #0f172a;
        text-align: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at top left, rgba(29,78,216,0.08), transparent 45%),
          linear-gradient(180deg, #eef3f9, #e8eef6 50%, #f3efe6);
      }
      .sangam-boot__mark {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        background: linear-gradient(135deg, #0b1f3a, #0f766e);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 32px;
        font-weight: 700;
        font-family: Georgia, "Source Serif 4", serif;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
      }
      .sangam-boot__img {
        width: min(420px, 90vw);
        height: auto;
        border-radius: 16px;
        display: block;
        margin: 8px auto 0;
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
      }
      .sangam-boot__title { font-size: 1.75rem; font-weight: 700; margin: 0; }
      .sangam-boot__sub { margin: 0; color: #475569; font-size: 0.95rem; max-width: 28rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="sangam-boot" id="sangam-boot">
        <div class="sangam-boot__mark" aria-hidden="true">S</div>
        <p class="sangam-boot__title">SANGAM</p>
        <img
          class="sangam-boot__img"
          src="./og-image.svg"
          width="840"
          height="440"
          alt="SANGAM societal innovation platform"
        />
        <p class="sangam-boot__sub">Loading societal innovation platform…</p>
      </div>
    </div>
    <noscript>
      <div class="sangam-boot">
        <div class="sangam-boot__mark">S</div>
        <p class="sangam-boot__title">SANGAM</p>
        <img class="sangam-boot__img" src="./og-image.svg" alt="SANGAM" />
        <p class="sangam-boot__sub">
          JavaScript is required. Enable JS, then open this folder through a web server
          or run <code>deploy-local.bat</code> and visit <code>http://localhost:8100</code>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
