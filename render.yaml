services:
  - type: web
    name: sangam
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./sangam.db
      # Same-origin SPA in the container; "*" is accepted with credentials disabled.
      - key: CORS_ORIGINS
        value: "*"
      - key: DATA_MODE
        value: prototype
